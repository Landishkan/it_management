<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | DevOrder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="glass-card auth-card">
        <h2>Вход в личный кабинет</h2>
        <p class="subtitle">Отслеживайте статус ваших заказов</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="Введите логин" >
            </div>
            <div class="form-group">
                <label for="loginPassword">Пароль</label>
                <input type="password" id="loginPassword" placeholder="Введите пароль" >
            </div>

            <div class="form-error" id="loginError"></div>

            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Войти</button>
        </form>

        <p class="form-footer">
            Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
        </p>
        <p class="form-footer" style="color:var(--text-dim);font-size:11px;margin-top:12px;">
           Сайт предназначен для клиентов
        </p>
    </div>

    <script src="app.js"></script>
</body>
</html>
